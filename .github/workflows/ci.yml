name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --group dev python -m unittest discover -s packages/harness-manifest/tests -t packages/harness-manifest/tests
      - run: uv run --group dev python -m unittest discover -s packages/harness-secrets/tests -t packages/harness-secrets/tests
      - run: uv run --group dev python -m unittest discover -s packages/harness-factory/tests -t packages/harness-factory/tests
